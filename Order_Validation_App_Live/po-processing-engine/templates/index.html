<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Processing Engine</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <main class="container">
        <header class="app-header">
            <div class="app-header-icon">📄</div>
            <div class="app-header-text">
                <h1>PO Processing Engine</h1>
                <p>Edit distributor purchase orders and regenerate the PDF</p>
            </div>
            <div class="app-header-tags">
                <span id="status" class="app-tag status">Checking server status&hellip;</span>
            </div>
        </header>

        <section class="card">
            <p class="card-title">Salesforce Quote</p>
            <div class="picker-row">
                <label for="sf-quote-search">Pull from Salesforce</label>
                <input id="sf-quote-search" type="text" placeholder="Search Quote Name&hellip;">
                <button id="sf-search-btn" type="button" class="secondary">Search</button>
                <label for="sf-org-select" class="sf-org-label">Org</label>
                <select id="sf-org-select"></select>
            </div>
        </section>
        <ul id="sf-search-results" class="sf-results" hidden></ul>

        <section class="card">
            <p class="card-title">Distributor</p>
            <div class="picker-row">
                <label for="distributor-select">Distributor</label>
                <select id="distributor-select"></select>
                <button id="load-template-btn" type="button">Load template</button>
            </div>
        </section>

        <p id="message" class="message" hidden></p>

        <section id="workspace" hidden>
            <div class="card">
                <h2>Fields</h2>
                <div id="fields-grid" class="fields-grid"></div>
            </div>

            <div class="card">
                <h2>Line items</h2>
                <div class="table-wrap">
                    <table id="line-items-table" class="line-items-table">
                        <thead>
                            <tr>
                                <th class="serial-col">S.No</th>
                                <th>Part number</th>
                                <th>Description</th>
                                <th>Qty</th>
                                <th>Unit cost</th>
                                <th>% disc.</th>
                                <th>Terms</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="line-items-body"></tbody>
                    </table>
                </div>
                <button id="add-row-btn" type="button" class="secondary">+ Add line item</button>
            </div>

            <div class="actions">
                <button id="preview-btn" type="button" class="secondary">Preview PDF</button>
                <button id="generate-btn" type="button">Generate &amp; download PDF</button>
            </div>

            <div id="pdf-preview-container" hidden>
                <h2>Preview</h2>
                <iframe id="pdf-preview-frame" title="PDF preview"></iframe>
            </div>
        </section>
    </main>
    <script src="/static/script.js?v=3"></script>
</body>
</html>
